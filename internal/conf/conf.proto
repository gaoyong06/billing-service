syntax = "proto3";
package kratos.api;

option go_package = "billing-service/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
  Billing billing = 3;
  PaymentService payment_service = 4;
  Scheduler scheduler = 5;
  Log log = 6;
}

message Log {
  string level = 1;
  string format = 2;
  string output = 3;
  string server_file_path = 4;
  string scheduler_file_path = 9;
  int32 max_size = 5;
  int32 max_age = 6;
  int32 max_backups = 7;
  bool compress = 8;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
  }
  Database database = 1;
  Redis redis = 2;
  RocketMQ rocketmq = 3;

  message RocketMQ {
    repeated string name_servers = 1;
    string group_name = 2;
    string topic = 3;
    int32 retry_times = 4;
    google.protobuf.Duration send_timeout = 5;
    bool enabled = 6;
  }
}

message Billing {
  map<string, double> prices = 1;
  map<string, int32> free_quotas = 2;
  // 余额低阈值（单位：元），当余额低于此值时触发告警
  double balance_low_threshold = 3;
  // 配额低阈值（百分比），当剩余配额低于此百分比时触发告警
  double quota_low_percent_threshold = 4;
  // 开发模式开关，开启后跳过余额检查，扣费操作始终返回成功（默认：true）
  bool dev_mode = 5;
  // 免费应用白名单（app_id 列表），这些应用的所有调用都不扣费（用于官方应用等）
  repeated string free_app_ids = 6;
}

message PaymentService {
  string grpc_addr = 1;
  google.protobuf.Duration timeout = 2;
  string return_url = 3;  // 支付成功后的返回URL
  string notify_url = 4;  // 支付回调通知URL
}

message Scheduler {
  message FreeQuotaResetTask {
    string cron = 1;  // Cron 表达式（每月1日 00:00 执行，默认: "0 0 0 1 * *"）
    bool enabled = 2;  // 是否启用
  }
  FreeQuotaResetTask free_quota_reset_task = 1;
}
