syntax = "proto3";

package billing.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "billing-service/api/billing/v1;v1";

// BillingService 计费服务（外部接口）
// 面向前端/开发者的接口
service BillingService {
  // 开发者维度：获取账户余额与汇总配额（app_id 为空）
  rpc GetAccountQuota(GetAccountQuotaRequest) returns (GetAccountQuotaReply) {
    option (google.api.http) = {
      get: "/billing/v1/billing/account-quota"
    };
  }

  // 应用维度：获取指定应用的配额与用量（含免费应用「已用/无限制」与 isFreeApp）
  rpc GetAppQuota(GetAppQuotaRequest) returns (GetAppQuotaReply) {
    option (google.api.http) = {
      get: "/billing/v1/billing/app-quota"
    };
  }

  // 发起充值 (返回支付链接)
  rpc Recharge(RechargeRequest) returns (RechargeReply) {
    option (google.api.http) = {
      post: "/billing/v1/billing/recharge"
      body: "*"
    };
  }

  // 获取消费流水
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsReply) {
    option (google.api.http) = {
      get: "/billing/v1/billing/records"
    };
  }

  // 获取今日调用统计
  rpc GetStatsToday(GetStatsTodayRequest) returns (GetStatsReply) {
    option (google.api.http) = {
      get: "/billing/v1/billing/stats/today"
    };
  }

  // 获取本月调用统计
  rpc GetStatsMonth(GetStatsMonthRequest) returns (GetStatsReply) {
    option (google.api.http) = {
      get: "/billing/v1/billing/stats/month"
    };
  }

  // 获取本月用量汇总（用户维度）
  // 用途：基于 billing_record 流水聚合，返回该用户「本月」所有应用的总调用次数、总费用及各服务免费/付费次数；用于总览页、报表。与 GetAppQuota（单应用配额与剩余）不同。
  rpc GetMonthlyUsageSummary(GetMonthlyUsageSummaryRequest) returns (GetMonthlyUsageSummaryReply) {
    option (google.api.http) = {
      get: "/billing/v1/billing/stats/monthly-usage-summary"
    };
  }
}

// BillingInternalService 计费内部服务（内部接口）
// 面向内部服务（Gateway/Payment）的接口
service BillingInternalService {
  // 检查并预扣费 (Check & Reserve)
  rpc CheckQuota(CheckQuotaRequest) returns (CheckQuotaReply) {
    option (google.api.http) = {
      post: "/billing/v1/internal/check"
      body: "*"
    };
  }

  // 确认扣费 (Commit)
  rpc DeductQuota(DeductQuotaRequest) returns (DeductQuotaReply) {
    option (google.api.http) = {
      post: "/billing/v1/internal/deduct"
      body: "*"
    };
  }

  // 充值回调 (来自 Payment Service)
  rpc RechargeCallback(RechargeCallbackRequest) returns (RechargeCallbackReply) {
    option (google.api.http) = {
      post: "/billing/v1/internal/callback"
      body: "*"
    };
  }
}

// 开发者维度
message GetAccountQuotaRequest {
  string userId = 1;
}

message GetAccountQuotaReply {
  string userId = 1;
  double balance = 2;
  repeated FreeQuota quotas = 3;
}

// 应用维度
message GetAppQuotaRequest {
  string userId = 1;
  string appId = 2;
}

message GetAppQuotaReply {
  string userId = 1;
  double balance = 2;
  repeated FreeQuota quotas = 3;
  bool isFreeApp = 4; // 是否为免费应用（白名单），前端可展示「免费应用」标识
}

message FreeQuota {
  string serviceName = 1;
  int32 totalQuota = 2;
  int32 usedQuota = 3;
  string resetMonth = 4;
  // 是否为无限额度（如免费应用），前端可展示为「已用 / 无限制」
  bool isUnlimited = 5;
}

message RechargeRequest {
  string userId = 1;
  double amount = 2;
  string paymentMethod = 3; // wechat, alipay
  string currency = 4; // 币种，必填，例如：CNY, USD
}

message RechargeReply {
  string rechargeOrderId = 1; // 充值订单ID（billing-service生成，格式：recharge_{user_id}_{timestamp}）
  string paymentUrl = 2; // 支付URL
}

message ListRecordsRequest {
  string userId = 1;
  int32 page = 2;
  int32 pageSize = 3;
}

message ListRecordsReply {
  repeated BillingRecord records = 1;
  int32 total = 2;
}

message BillingRecord {
  string billingRecordId = 1; // 对应表 billing_record.billing_record_id
  string appId = 2; // 应用ID（用于按应用统计成本）
  string serviceName = 3;
  int32 type = 4; // 1:免费额度, 2:余额扣费
  double amount = 5;
  int32 count = 6;
  google.protobuf.Timestamp createdAt = 7;
}

message CheckQuotaRequest {
  string userId = 1;
  string appId = 2; // 应用ID（必填，用于按应用统计成本）
  string serviceName = 3;
  int32 count = 4;
}

message CheckQuotaReply {
  bool allowed = 1;
  string reason = 2;
}

message DeductQuotaRequest {
  string userId = 1;
  string appId = 2; // 应用ID（必填，用于按应用统计成本）
  string serviceName = 3;
  int32 count = 4;
  double cost = 5;
}

message DeductQuotaReply {
  bool success = 1;
  string recordId = 2;
}

message RechargeCallbackRequest {
  string rechargeOrderId = 1; // 充值订单ID（billing-service生成，格式：recharge_{user_id}_{timestamp}）
  string paymentId = 2; // 支付流水号（payment-service返回的payment_id）
  double amount = 3; // 充值金额
  string status = 4; // 支付状态
}

message RechargeCallbackReply {
  bool success = 1;
}

// 统计相关消息
message GetStatsTodayRequest {
  string userId = 1;
  string serviceName = 2; // 可选，不传则统计所有服务
}

message GetStatsMonthRequest {
  string userId = 1;
  string serviceName = 2; // 可选，不传则统计所有服务
}

// 本月用量汇总请求（用户维度）
message GetMonthlyUsageSummaryRequest {
  string userId = 1;
}

message GetStatsReply {
  string userId = 1;
  string serviceName = 2; // 如果请求时指定了服务名称，这里返回；否则为空
  int32 totalCount = 3;   // 总调用次数
  double totalCost = 4;   // 总费用（仅余额扣费部分）
  int32 freeCount = 5;    // 免费额度使用次数
  int32 paidCount = 6;    // 余额扣费次数
  string period = 7;       // 统计周期：today 或 month
}

message ServiceStats {
  string serviceName = 1; // 服务名称
  int32 totalCount = 2;   // 总调用次数
  double totalCost = 3;   // 总费用
  int32 freeCount = 4;    // 免费额度使用次数
  int32 paidCount = 5;    // 余额扣费次数
}

// 本月用量汇总响应：用户维度、本月消费流水汇总（与 GetAppQuota 的「配额与剩余」不同）
message GetMonthlyUsageSummaryReply {
  string userId = 1;
  int32 totalCount = 2;   // 本月所有服务总调用次数
  double totalCost = 3;   // 本月所有服务总费用（余额扣费部分）
  repeated ServiceStats services = 4; // 各服务本月统计（totalCount/totalCost/freeCount/paidCount）
}
